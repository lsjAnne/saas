name: backend-delivery

on:
  push:
    branches:
      - saas
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish image to registry
        required: true
        default: true
        type: boolean
      image_tag:
        description: Optional image tag override
        required: false
        type: string

concurrency:
  group: backend-delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dian-shang-ping-tai

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate standard saas compose
        run: docker compose -f docker-compose.saas.yml config > /tmp/docker-compose.saas.rendered.yml

      - name: Validate private compose
        run: docker compose -f docker-compose.private.yml config > /tmp/docker-compose.private.rendered.yml

  test-and-package:
    needs: validate-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven test
        working-directory: backend
        run: mvn -B test

      - name: Maven package
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/dianShangPingTai-1.0.0-SNAPSHOT.jar

  build-image:
    needs: test-and-package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_image)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Resolve image tag
        id: image-meta
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image-meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
