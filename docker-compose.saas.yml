services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE_NAME:-dian-shang-ping-tai:saas}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-postgres,stage13-local}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/dian_shang_ping_tai}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-saas_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-saas_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-saas_redis_password}
      APP_STAGE13_LOCAL_HTTP_PORT: ${APP_STAGE13_LOCAL_HTTP_PORT:-18081}
      APP_STAGE13_LOCAL_TCP_PORT: ${APP_STAGE13_LOCAL_TCP_PORT:-15671}
      APP_AUTH_TOKEN_SECRET: ${APP_AUTH_TOKEN_SECRET:-saas-token-secret-change-me}
      APP_AUTH_BOOTSTRAP_PASSWORD: ${APP_AUTH_BOOTSTRAP_PASSWORD:-saas-bootstrap-password-change-me}
      APP_AUTH_REQUIRE_EXPLICIT_SECRETS: ${APP_AUTH_REQUIRE_EXPLICIT_SECRETS:-true}
      APP_AUTH_ALLOW_LEGACY_HEADER_CONTEXT: ${APP_AUTH_ALLOW_LEGACY_HEADER_CONTEXT:-false}
      APP_DEPLOYMENT_DEFAULT_MODE: standard-saas
      APP_DEPLOYMENT_SUPPORTED_MODES: standard-saas,private-deployment
      APP_NOTIFICATION_REQUIRE_CONFIGURED_GATEWAY: true
      APP_NOTIFICATION_SMS_MOCK_MODE: false
      APP_NOTIFICATION_EMAIL_MOCK_MODE: false
      APP_NOTIFICATION_FEISHU_MOCK_MODE: false
      APP_EXTERNAL_ERP_ENDPOINT: ${APP_EXTERNAL_ERP_ENDPOINT:-http://127.0.0.1:18081/ofbiz/webtools/control}
      APP_EXTERNAL_ERP_CREDENTIAL_CONFIGURED: ${APP_EXTERNAL_ERP_CREDENTIAL_CONFIGURED:-true}
      APP_EXTERNAL_WMS_ENDPOINT: ${APP_EXTERNAL_WMS_ENDPOINT:-http://127.0.0.1:18081/openboxes/api}
      APP_EXTERNAL_WMS_CREDENTIAL_CONFIGURED: ${APP_EXTERNAL_WMS_CREDENTIAL_CONFIGURED:-true}
      APP_EXTERNAL_TAX_ENDPOINT: ${APP_EXTERNAL_TAX_ENDPOINT:-http://127.0.0.1:18081/tax/api}
      APP_EXTERNAL_TAX_CREDENTIAL_CONFIGURED: ${APP_EXTERNAL_TAX_CREDENTIAL_CONFIGURED:-true}
      APP_EXTERNAL_MESSAGING_ENDPOINT: ${APP_EXTERNAL_MESSAGING_ENDPOINT:-amqp://127.0.0.1:15671/tenant-hub}
      APP_EXTERNAL_MESSAGING_CREDENTIAL_CONFIGURED: ${APP_EXTERNAL_MESSAGING_CREDENTIAL_CONFIGURED:-true}
      APP_EXTERNAL_MESSAGING_CALLBACK_URL: ${APP_EXTERNAL_MESSAGING_CALLBACK_URL:-http://127.0.0.1:18081/callback-worker/consume}
      APP_EXTERNAL_BI_ENDPOINT: ${APP_EXTERNAL_BI_ENDPOINT:-http://127.0.0.1:18081/superset/api/v1}
      APP_EXTERNAL_BI_CREDENTIAL_CONFIGURED: ${APP_EXTERNAL_BI_CREDENTIAL_CONFIGURED:-true}
      APP_OBSERVABILITY_LOG_ENDPOINT: ${APP_OBSERVABILITY_LOG_ENDPOINT:-http://127.0.0.1:18081/observability/logs}
      APP_OBSERVABILITY_TRACE_ENDPOINT: ${APP_OBSERVABILITY_TRACE_ENDPOINT:-http://127.0.0.1:18081/observability/traces}
      APP_OBSERVABILITY_ALERT_ENDPOINT: ${APP_OBSERVABILITY_ALERT_ENDPOINT:-http://127.0.0.1:18081/observability/alerts}
      APP_OBSERVABILITY_DASHBOARD_URL: ${APP_OBSERVABILITY_DASHBOARD_URL:-http://127.0.0.1:18081/observability/dashboard}
      APP_DELIVERY_GITHUB_OWNER: ${APP_DELIVERY_GITHUB_OWNER:-lsjAnne}
      APP_DELIVERY_GITHUB_REPOSITORY: ${APP_DELIVERY_GITHUB_REPOSITORY:-saas}
      APP_DELIVERY_REGISTRY: ${APP_DELIVERY_REGISTRY:-ghcr.io}
      APP_DELIVERY_IMAGE_REPOSITORY: ${APP_DELIVERY_IMAGE_REPOSITORY:-lsjAnne/dian-shang-ping-tai}
      APP_DELIVERY_RELEASE_KEY_CONFIGURED: ${APP_DELIVERY_RELEASE_KEY_CONFIGURED:-true}
      APP_DELIVERY_REGISTRY_AUTH_CONFIGURED: ${APP_DELIVERY_REGISTRY_AUTH_CONFIGURED:-true}
      APP_DELIVERY_GITHUB_PUBLISH_MODE: ${APP_DELIVERY_GITHUB_PUBLISH_MODE:-github-actions}
      APP_DELIVERY_CANARY_ENABLED: ${APP_DELIVERY_CANARY_ENABLED:-true}
      APP_DELIVERY_CANARY_STRATEGY: ${APP_DELIVERY_CANARY_STRATEGY:-header-weighted}
      APP_DELIVERY_GITHUB_PROBE_ENDPOINT: ${APP_DELIVERY_GITHUB_PROBE_ENDPOINT:-http://127.0.0.1:18081/delivery/github/lsjAnne/saas}
      APP_DELIVERY_REGISTRY_PROBE_ENDPOINT: ${APP_DELIVERY_REGISTRY_PROBE_ENDPOINT:-http://127.0.0.1:18081/delivery/registry/lsjAnne/dian-shang-ping-tai}
      APP_DELIVERY_STANDARD_SAAS_BASE_URL: ${APP_DELIVERY_STANDARD_SAAS_BASE_URL:-http://127.0.0.1:18081/delivery/standard-saas}
      APP_DELIVERY_STANDARD_SAAS_VERIFIED_AT: ${APP_DELIVERY_STANDARD_SAAS_VERIFIED_AT:-2026-06-13T10:00:00+08:00}
      APP_DELIVERY_PRIVATE_BASE_URL: ${APP_DELIVERY_PRIVATE_BASE_URL:-http://127.0.0.1:18081/delivery/private}
      APP_DELIVERY_PRIVATE_VERIFIED_AT: ${APP_DELIVERY_PRIVATE_VERIFIED_AT:-2026-06-13T10:05:00+08:00}
    ports:
      - "18080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dian_shang_ping_tai}
      POSTGRES_USER: ${POSTGRES_USER:-saas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas_password}
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas_user} -d ${POSTGRES_DB:-dian_shang_ping_tai}"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${SPRING_DATA_REDIS_PASSWORD:-saas_redis_password}"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD:-saas_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
