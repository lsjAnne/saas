server:
  port: 8080

spring:
  application:
    name: dianShangPingTai
  datasource:
    url: jdbc:h2:mem:dianShangPingTai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: ${APP_REDIS_HOST:127.0.0.1}
      port: ${APP_REDIS_PORT:16379}
      password: ${APP_REDIS_PASSWORD:saas_redis_password}
      timeout: 2s
      connect-timeout: 2s
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/V001__tenant_and_org.sql
        - classpath:db/migration/V002__saas_subscription.sql
        - classpath:db/migration/V003__platform_audit_support.sql
        - classpath:db/migration/V004__billing_invoice_feature_toggle.sql
        - classpath:db/migration/V005__store_and_channel_account.sql
        - classpath:db/migration/V006__product_supplier_draft.sql
        - classpath:db/migration/V007__mapping_inventory_replenishment.sql
        - classpath:db/migration/V008__order_and_fulfillment.sql
        - classpath:db/migration/V009__logistics_and_exception.sql
        - classpath:db/migration/V010__servicecase_and_after_sale.sql
        - classpath:db/migration/V011__conversation_and_faq.sql
        - classpath:db/migration/V012__live_plan_session_script.sql
        - classpath:db/migration/V013__live_product_item.sql
        - classpath:db/migration/V014__automation_rule.sql
        - classpath:db/migration/V015__approval_instance.sql
        - classpath:db/migration/V016__notification_center.sql
        - classpath:db/migration/V017__campaign_center.sql
        - classpath:db/migration/V018__member_finance_dashboard.sql
        - classpath:db/migration/V019__auth_center_and_rbac.sql
        - classpath:db/migration/V020__openplatform.sql
        - classpath:db/migration/V021__openplatform_security_and_logs.sql
        - classpath:db/migration/V022__openplatform_credentials.sql
        - classpath:db/migration/V023__tenant_governance_exports_and_compliance.sql
        - classpath:db/migration/V024__tenant_cleanup_task.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  persistence:
    mode: jdbc
  redis:
    verify-on-startup: false
    tenant-key-prefix: dsp
  release:
    automation-evidence:
      suite-count: ${APP_RELEASE_AUTOMATION_EVIDENCE_SUITE_COUNT:0}
      environment: ${APP_RELEASE_AUTOMATION_EVIDENCE_ENVIRONMENT:}
      executed-at: ${APP_RELEASE_AUTOMATION_EVIDENCE_EXECUTED_AT:}
      summary: ${APP_RELEASE_AUTOMATION_EVIDENCE_SUMMARY:}
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:local-dev-auth-token-secret-change-me}
    token-expire-seconds: ${APP_AUTH_TOKEN_EXPIRE_SECONDS:43200}
    bootstrap-password: ${APP_AUTH_BOOTSTRAP_PASSWORD:123456}
    require-explicit-secrets: false
    bootstrap-admin-username: ${APP_AUTH_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-display-name: ${APP_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:平台系统管理员}
  observability:
    log-aggregation-endpoint: ${APP_OBSERVABILITY_LOG_ENDPOINT:}
    trace-endpoint: ${APP_OBSERVABILITY_TRACE_ENDPOINT:}
    alert-router-endpoint: ${APP_OBSERVABILITY_ALERT_ENDPOINT:}
    dashboard-url: ${APP_OBSERVABILITY_DASHBOARD_URL:}
  deployment:
    default-mode: ${APP_DEPLOYMENT_DEFAULT_MODE:standard-saas}
    supported-modes: ${APP_DEPLOYMENT_SUPPORTED_MODES:standard-saas,private-deployment}
  delivery:
    github-owner: ${APP_DELIVERY_GITHUB_OWNER:lsjAnne}
    github-repository: ${APP_DELIVERY_GITHUB_REPOSITORY:saas}
    registry: ${APP_DELIVERY_REGISTRY:ghcr.io}
    image-repository: ${APP_DELIVERY_IMAGE_REPOSITORY:lsjAnne/dian-shang-ping-tai}
    release-key-configured: ${APP_DELIVERY_RELEASE_KEY_CONFIGURED:false}
    canary-enabled: ${APP_DELIVERY_CANARY_ENABLED:false}
    standard-saas-base-url: ${APP_DELIVERY_STANDARD_SAAS_BASE_URL:}
    standard-saas-verified-at: ${APP_DELIVERY_STANDARD_SAAS_VERIFIED_AT:}
    private-base-url: ${APP_DELIVERY_PRIVATE_BASE_URL:}
    private-verified-at: ${APP_DELIVERY_PRIVATE_VERIFIED_AT:}
  integrations:
    external:
      probe-timeout-millis: ${APP_EXTERNAL_PROBE_TIMEOUT_MILLIS:1500}
      required-systems: ${APP_EXTERNAL_REQUIRED_SYSTEMS:erp,wms,tax,messaging,bi,routing}
      bi:
        provider: ${APP_EXTERNAL_BI_PROVIDER:superset}
        endpoint: ${APP_EXTERNAL_BI_ENDPOINT:}
        dashboard-count: ${APP_EXTERNAL_BI_DASHBOARD_COUNT:0}
        dataset-count: ${APP_EXTERNAL_BI_DATASET_COUNT:0}
        embed-enabled: ${APP_EXTERNAL_BI_EMBED_ENABLED:false}
      routing:
        provider: ${APP_EXTERNAL_ROUTING_PROVIDER:osrm}
        endpoint: ${APP_EXTERNAL_ROUTING_ENDPOINT:}
        profile: ${APP_EXTERNAL_ROUTING_PROFILE:driving}
        fallback-enabled: ${APP_EXTERNAL_ROUTING_FALLBACK_ENABLED:true}
        timeout-millis: ${APP_EXTERNAL_ROUTING_TIMEOUT_MILLIS:2000}
      erp:
        provider: ${APP_EXTERNAL_ERP_PROVIDER:ofbiz}
        endpoint: ${APP_EXTERNAL_ERP_ENDPOINT:}
        party-sync-enabled: ${APP_EXTERNAL_ERP_PARTY_SYNC_ENABLED:false}
        order-sync-mode: ${APP_EXTERNAL_ERP_ORDER_SYNC_MODE:manual}
        ledger-mapping-count: ${APP_EXTERNAL_ERP_LEDGER_MAPPING_COUNT:0}
        catalog-export-enabled: ${APP_EXTERNAL_ERP_CATALOG_EXPORT_ENABLED:false}
      wms:
        provider: ${APP_EXTERNAL_WMS_PROVIDER:openboxes}
        endpoint: ${APP_EXTERNAL_WMS_ENDPOINT:}
        facility-count: ${APP_EXTERNAL_WMS_FACILITY_COUNT:0}
        stock-sync-mode: ${APP_EXTERNAL_WMS_STOCK_SYNC_MODE:manual}
        outbound-flow: ${APP_EXTERNAL_WMS_OUTBOUND_FLOW:manual}
        batch-tracking-enabled: ${APP_EXTERNAL_WMS_BATCH_TRACKING_ENABLED:false}
      messaging:
        provider: ${APP_EXTERNAL_MESSAGING_PROVIDER:rabbitmq}
        endpoint: ${APP_EXTERNAL_MESSAGING_ENDPOINT:}
        virtual-host: ${APP_EXTERNAL_MESSAGING_VIRTUAL_HOST:}
        exchange: ${APP_EXTERNAL_MESSAGING_EXCHANGE:}
        queue-count: ${APP_EXTERNAL_MESSAGING_QUEUE_COUNT:0}
        callback-bridge-enabled: ${APP_EXTERNAL_MESSAGING_CALLBACK_BRIDGE_ENABLED:false}
        dead-letter-enabled: ${APP_EXTERNAL_MESSAGING_DEAD_LETTER_ENABLED:false}
      systems:
        erp:
          endpoint: ${APP_EXTERNAL_ERP_ENDPOINT:}
          credential-configured: ${APP_EXTERNAL_ERP_CREDENTIAL_CONFIGURED:false}
        wms:
          endpoint: ${APP_EXTERNAL_WMS_ENDPOINT:}
          credential-configured: ${APP_EXTERNAL_WMS_CREDENTIAL_CONFIGURED:false}
        tax:
          endpoint: ${APP_EXTERNAL_TAX_ENDPOINT:}
          credential-configured: ${APP_EXTERNAL_TAX_CREDENTIAL_CONFIGURED:false}
        messaging:
          endpoint: ${APP_EXTERNAL_MESSAGING_ENDPOINT:}
          credential-configured: ${APP_EXTERNAL_MESSAGING_CREDENTIAL_CONFIGURED:false}
          callback-url: ${APP_EXTERNAL_MESSAGING_CALLBACK_URL:}
          callback-required: ${APP_EXTERNAL_MESSAGING_CALLBACK_REQUIRED:true}
        bi:
          endpoint: ${APP_EXTERNAL_BI_ENDPOINT:}
          credential-configured: ${APP_EXTERNAL_BI_CREDENTIAL_CONFIGURED:false}
        routing:
          endpoint: ${APP_EXTERNAL_ROUTING_ENDPOINT:}
          credential-configured: ${APP_EXTERNAL_ROUTING_CONNECTION_CONFIGURED:true}
    notification:
      require-configured-gateway: ${APP_NOTIFICATION_REQUIRE_CONFIGURED_GATEWAY:false}
      channel-bindings:
        site_message: site_message_inapp
        sms: aliyun_sms
        email: smtp_default
        feishu_bot: feishu_default
      providers:
        site_message_inapp:
          notify-type: site_message
          enabled: true
          mock-mode: true
          receipt-supported: false
          endpoint: internal://notification-center
          description: in-app notification gateway
        aliyun_sms:
          notify-type: sms
          enabled: true
          mock-mode: ${APP_NOTIFICATION_SMS_MOCK_MODE:true}
          receipt-supported: true
          endpoint: ${APP_NOTIFICATION_SMS_ENDPOINT:https://dysmsapi.aliyuncs.com}
          receipt-callback-path: /api/notifications/{id}/delivery-receipts
          description: aliyun sms gateway
        smtp_default:
          notify-type: email
          enabled: true
          mock-mode: ${APP_NOTIFICATION_EMAIL_MOCK_MODE:true}
          receipt-supported: true
          endpoint: ${APP_NOTIFICATION_EMAIL_ENDPOINT:smtp://mail.example.com:25}
          receipt-callback-path: /api/notifications/{id}/delivery-receipts
          description: smtp mail gateway
        feishu_default:
          notify-type: feishu_bot
          enabled: true
          mock-mode: ${APP_NOTIFICATION_FEISHU_MOCK_MODE:true}
          receipt-supported: true
          endpoint: ${APP_NOTIFICATION_FEISHU_ENDPOINT:https://open.feishu.cn/open-apis/bot/v2/hook}
          receipt-callback-path: /api/notifications/{id}/delivery-receipts
          description: feishu bot gateway

